<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1113" />
    <title>Chatlog</title>
    <!-- 검색 결과 설명·링크 미리보기 (docs/05-ui-ux.md 8절 SEO). 화면별 제목은 usePageMeta 가 바꾼다 -->
    <meta name="description" content="AI 챗봇과 대화하고, 내 대화 기록을 다시 볼 수 있는 서비스입니다. 이메일로 가입해 바로 질문해 보세요." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chatlog" />
    <meta property="og:title" content="Chatlog" />
    <meta property="og:description" content="AI 챗봇과 대화하고, 내 대화 기록을 다시 볼 수 있는 서비스입니다." />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      폰트 CSS 는 화면 그리기를 막지 않게 받는다 (docs/05-ui-ux.md 1절).
      stylesheet 로 두면 한글 폰트 CSS(40KB)를 다 받을 때까지 빈 화면이다.
      preload 는 미리 받기만 하므로, 다 받으면(onload) stylesheet 로 바꿔 적용한다.
      폰트가 오기 전에는 기본 글꼴로 먼저 보인다 (URL 의 display=swap).
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
  </head>
  <body>
    <!-- 화면을 전부 스크립트로 그리므로, 꺼져 있으면 빈 화면 대신 이유를 알린다 -->
    <noscript>Chatlog 는 JavaScript 가 필요합니다. 브라우저 설정에서 JavaScript 를 켠 뒤 새로고침해 주세요.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
